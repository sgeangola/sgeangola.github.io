<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pauta Geral — SGE Angola</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            margin: 0;

            padding: 20px;

            background: #f1f5f9;

        }


        .container {

            max-width: 1500px;

            margin: auto;

            background: white;

            padding: 20px;

            border-radius: 10px;

            box-shadow:
                0 2px 10px
                rgba(0,0,0,.08);

        }


        h1 {

            margin-top: 0;

            color: #1e3a8a;

        }


        /* ===============================
           FILTROS
        =============================== */

        .filtros {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 20px;

        }


        select,
        button {

            padding: 10px;

            border:
                1px solid #cbd5e1;

            border-radius: 6px;

            font-size: 14px;

        }


        select {

            background: white;

        }


        button {

            cursor: pointer;

            background: #2563eb;

            color: white;

            border: none;

        }


        button:hover {

            background: #1d4ed8;

        }


        #exportarExcel {

            background: #15803d;

        }


        #exportarPDF {

            background: #b91c1c;

        }


        #imprimirPauta {

            background: #475569;

        }


        /* ===============================
           ESTADO
        =============================== */

        #estadoPauta {

            margin-bottom: 15px;

            color: #475569;

            font-weight: bold;

        }


        /* ===============================
           CABEÇALHO DA PAUTA
        =============================== */

        .cabecalho-pauta {

            text-align: center;

            padding: 15px;

            margin-bottom: 20px;

            border-bottom:
                2px solid #1e3a8a;

        }


        .cabecalho-pauta h2 {

            margin: 0 0 8px;

            color: #1e3a8a;

            font-size: 22px;

        }


        .cabecalho-pauta .ano {

            font-size: 15px;

            margin: 5px;

        }


        .cabecalho-pauta .info {

            display: flex;

            justify-content: center;

            gap: 30px;

            flex-wrap: wrap;

            margin-top: 10px;

            font-weight: bold;

        }


        .cabecalho-pauta h3 {

            margin-top: 15px;

            margin-bottom: 0;

            font-size: 20px;

        }


        /* ===============================
           TABELA
        =============================== */

        .tabela-container {

            overflow-x: auto;

        }


        table {

            border-collapse: collapse;

            width: 100%;

            min-width: 1800px;

        }


        th,
        td {

            border:
                1px solid #cbd5e1;

            padding: 6px;

            text-align: center;

            font-size: 12px;

        }


        th {

            background: #e2e8f0;

            font-weight: bold;

        }


        .nome-aluno {

            text-align: left;

            min-width: 230px;

        }


        .numero {

            width: 45px;

        }


        .sexo {

            width: 55px;

        }


        .idade {

            width: 55px;

        }


        .disciplina {

            background: #bfdbfe;

        }


        .trimestre {

            background: #dbeafe;

        }


        .subcoluna {

            background: #eff6ff;

        }


        .mf {

            font-weight: bold;

        }


        .media-final {

            font-weight: bold;

            background: #dbeafe;

        }


        .classificacao {

            font-weight: bold;

        }


        .aprovado {

            color: #15803d;

            font-weight: bold;

        }


        .reprovado {

            color: #dc2626;

            font-weight: bold;

        }


        .estado-vazio {

            padding: 30px;

            color: #64748b;

        }


        /* ===============================
           IMPRESSÃO
        =============================== */

        @media print {

            body {

                background: white;

                padding: 0;

            }


            .container {

                box-shadow: none;

                max-width: none;

                padding: 5px;

            }


            .filtros,
            #estadoPauta {

                display: none;

            }


            .cabecalho-pauta {

                display: block;

            }


            table {

                min-width: 1800px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        📋 Pauta Geral
    </h1>


    <!-- =========================================
         FILTROS
    ========================================== -->

    <div class="filtros">


        <select id="classeSelect">

            <option value="">
                Selecionar classe
            </option>

        </select>


        <select id="turmaSelect">

            <option value="">
                Selecionar turma
            </option>

        </select>


        <button id="carregarPauta">

            🔍 Carregar Pauta

        </button>


        <button id="exportarExcel">

            📊 Exportar Excel

        </button>


        <button id="exportarPDF">

            📄 Exportar PDF

        </button>


        <button id="imprimirPauta">

            🖨️ Imprimir

        </button>


    </div>


    <!-- =========================================
         ESTADO
    ========================================== -->

    <div id="estadoPauta">

        Selecione uma classe e uma turma.

    </div>


    <!-- =========================================
         CABEÇALHO DA ESCOLA
    ========================================== -->

    <div
        id="cabecalhoEscola"
        class="cabecalho-pauta"
    >

        <h2 id="nomeEscola">
            —
        </h2>


        <div
            id="anoLetivo"
            class="ano"
        >
            Ano Lectivo: —
        </div>


        <div class="info">

            <span id="classeInfo">
                Classe: —
            </span>


            <span id="turmaInfo">
                Turma: —
            </span>

        </div>


        <h3>
            PAUTA GERAL
        </h3>

    </div>


    <!-- =========================================
         TABELA
    ========================================== -->

    <div class="tabela-container">


        <table
            id="tabelaPauta"
            class="tabela-pauta"
        >


            <thead
                id="cabecalhoPauta"
            >
            </thead>


            <tbody
                id="pautaLista"
            >
            </tbody>


        </table>


    </div>


</div>


<!-- =========================================
     EXCEL
========================================== -->

<script
    src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js">
</script>


<!-- =========================================
     jsPDF
========================================== -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
</script>


<!-- =========================================
     jsPDF AUTOTABLE
========================================== -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js">
</script>


<!-- =========================================
     PAUTAS
========================================== -->

<script
    type="module"
    src="../services/pautas.js">
</script>


</body>
</html>
