<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pauta Geral — SGE Angola</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f1f5f9;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
        }

        .filtros {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        select,
        button {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            cursor: pointer;
            background: #2563eb;
            color: white;
            border: none;
        }

        .tabela-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th,
        td {
            border: 1px solid #cbd5e1;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #e2e8f0;
        }

        .nome {
            text-align: left;
            min-width: 220px;
        }

        .erro {
            color: #dc2626;
            padding: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📋 Pauta Geral</h1>

    <div class="filtros">

        <select id="turmaSelect">
            <option value="">
                Selecionar turma
            </option>
        </select>

        <button id="carregarPauta">
            🔍 Carregar Pauta
        </button>

        <button id="imprimirPauta">
            🖨️ Imprimir
        </button>

    </div>

    <div id="estado">
        Selecione uma turma.
    </div>

    <div class="tabela-container">

        <table id="tabelaPauta">

            <thead id="cabecalhoPauta">

            </thead>

            <tbody id="corpoPauta">

            </tbody>

        </table>

    </div>

</div>

<script
    type="module"
    src="../services/pautas.js">
</script>

</body>
</html>
