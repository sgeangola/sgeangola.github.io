<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — Super Admin | SGE Angola</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f4f9fc;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            color: #17324d;

        }


        .login-card {

            width: 100%;

            max-width: 420px;

            background: white;

            border: 1px solid #e0edf3;

            border-radius: 18px;

            padding: 35px;

            box-shadow:
                0 8px 30px
                rgba(30, 80, 110, .08);

        }


        .logo {

            width: 70px;

            height: 70px;

            margin: 0 auto 15px;

            border-radius: 15px;

            overflow: hidden;

            background: #087bb8;

        }


        .logo img {

            width: 100%;

            height: 100%;

            object-fit: contain;

        }


        h1 {

            text-align: center;

            font-size: 24px;

            margin-bottom: 5px;

        }


        .subtitulo {

            text-align: center;

            color: #718697;

            font-size: 14px;

            margin-bottom: 28px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: bold;

            color: #456477;

        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #d5e4ec;

            border-radius: 9px;

            outline: none;

            font-size: 14px;

            margin-bottom: 17px;

        }


        input:focus {

            border-color: #087bb8;

        }


        button {

            width: 100%;

            border: none;

            padding: 13px;

            border-radius: 9px;

            background: #087bb8;

            color: white;

            font-weight: bold;

            cursor: pointer;

            font-size: 14px;

        }


        button:hover {

            opacity: .9;

        }


        #mensagem {

            display: none;

            margin-top: 15px;

            padding: 11px;

            border-radius: 8px;

            font-size: 13px;

            text-align: center;

        }


        .voltar {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #087bb8;

            text-decoration: none;

            font-size: 13px;

        }

    </style>

</head>


<body>


    <div class="login-card">


        <div class="logo">

            <img
                src="../assets/logo.png"
                alt="SGE Angola"
            >

        </div>


        <h1>
            SGE Angola
        </h1>


        <p class="subtitulo">
            Área exclusiva do Super Administrador
        </p>


        <form id="loginSuperAdmin">


            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="E-mail do Super Admin"
                required
                autocomplete="username"
            >


            <label for="password">
                Palavra-passe
            </label>

            <input
                type="password"
                id="password"
                placeholder="Palavra-passe"
                required
                autocomplete="current-password"
            >


            <button
                type="submit"
                id="btnEntrar"
            >
                Entrar no Super Admin
            </button>


        </form>


        <div id="mensagem"></div>


        <a
            href="./login.html"
            class="voltar"
        >
            Voltar ao login principal
        </a>


    </div>


    <script
        type="module"
        src="../services/login-super-admin.js?v=1"
    ></script>


</body>

</html>
